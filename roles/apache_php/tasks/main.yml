---
- name: Instalar Apache, PHP y phpMyAdmin
  ansible.builtin.package:
    name:
      - apache2
      - php8
      - php8-cli
      - apache2-mod_php8
      - php8-curl
      - php8-gd
      - php8-mbstring
      - php8-mysql
      - phpMyAdmin
    state: present

- name: Habilitar e iniciar Apache
  ansible.builtin.service:
    name: apache2
    enabled: true
    state: started
