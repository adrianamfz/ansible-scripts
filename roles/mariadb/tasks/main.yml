- name: Instalar MariaDB y librería Python
  community.general.zypper:
    name:
      - mariadb
      - mariadb-client
      - "{{ mariadb_python_pkg }}"
    state: present

- name: Iniciar y habilitar MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Definir contraseña de root
  community.mysql.mysql_user:
    name: root
    host_all: true
    password: "{{ vault_db_root_password }}"
    check_implicit_admin: true
    login_user: root
    login_password: "{{ vault_db_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"
  no_log: true

- name: Crear base de datos
  community.mysql.mysql_db:
    name: "{{ mariadb_db_name }}"
    state: present
    login_user: root
    login_password: "{{ vault_db_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"

- name: Crear usuario de la base de datos
  community.mysql.mysql_user:
    name: "{{ mariadb_db_user }}"
    password: "{{ vault_db_app_password }}"
    priv: "{{ mariadb_db_name }}.*:ALL"
    host: localhost
    login_user: root
    login_password: "{{ vault_db_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"
  no_log: true
