---
- name: Instalar servidor FTP
  ansible.builtin.package:
    name: vsftpd
    state: present

- name: Copiar configuración de FTP
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../templates/vsftpd.conf"
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: '0600'
  notify: Reiniciar FTP

- name: Habilitar e iniciar FTP
  ansible.builtin.service:
    name: vsftpd
    enabled: true
    state: started
