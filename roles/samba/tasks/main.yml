- name: Instalar Samba
  community.general.zypper:
    name: samba
    state: present

- name: Crear usuario del sistema
  ansible.builtin.user:
    name: "{{ samba_user }}"
    shell: /sbin/nologin
    create_home: false

- name: Crear directorio compartido
  ansible.builtin.file:
    path: "{{ samba_dir }}"
    state: directory
    owner: "{{ samba_user }}"
    mode: "0770"

- name: Comprobar si el usuario Samba existe
  ansible.builtin.shell: "pdbedit -L | grep -q '^{{ samba_user }}:'"
  register: samba_user_exists
  changed_when: false
  failed_when: false

- name: Crear usuario de Samba
  ansible.builtin.shell: |
    (echo "{{ vault_samba_password }}"; echo "{{ vault_samba_password }}") | smbpasswd -s -a {{ samba_user }}
  when: samba_user_exists.rc != 0
  no_log: true

- name: Configurar smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: "0644"
    validate: "testparm -s %s"
  notify: Reiniciar samba

- name: Iniciar y habilitar Samba
  ansible.builtin.service:
    name: smb
    state: started
    enabled: true

- name: Comprobar firewalld
  ansible.builtin.command: which firewall-cmd
  register: samba_firewalld
  changed_when: false
  failed_when: false

- name: Abrir Samba en el firewall
  ansible.posix.firewalld:
    service: samba
    permanent: true
    immediate: true
    state: enabled
  when: samba_firewalld.rc == 0
