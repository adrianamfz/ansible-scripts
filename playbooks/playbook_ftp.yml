---
- name: Instalar y configurar vsftpd en openSUSE 16.0
  hosts: servidor
  become: yes

  tasks:
    - name: Actualizar repositorios
      ansible.builtin.zypper:
        name: '*'
        state: latest
        update_cache: yes
      retries: 5
      delay: 4
      when: ansible_facts['distribution'] == 'openSUSE Leap'
      register: zypper_update
      until: zypper_update is success

    - name: Instalar vsftpd
      ansible.builtin.zypper:
        name: vsftpd
        state: present

    - name: Asegurar que vsftpd esté habilitado e iniciado
      ansible.builtin.systemd:
        name: vsftpd
        enabled: yes
        state: started

    - name: Copiar plantilla de configuración FTP
      ansible.builtin.copy:
        src: ../templates/vsftpd.conf
        dest: /etc/vsftpd.conf
        owner: root
        group: root
        mode: '0644'
      notify: Reiniciar vsftpd

  handlers:
    - name: Reiniciar vsftpd
      ansible.builtin.systemd:
        name: vsftpd
        state: restarted
